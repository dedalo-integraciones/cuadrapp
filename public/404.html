<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada · Cuadra</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #040706;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 390px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 32px 24px;
        background: rgba(255, 255, 255, 0.03);
        text-align: center;
      }
      p.code {
        margin: 0 0 8px;
        color: #c8180f;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.2;
      }
      p.texto {
        margin: 0 0 24px;
        color: rgba(245, 245, 245, 0.72);
        font-size: 15px;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        background: #c8180f;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: #a51410;
      }
      a.secundario {
        margin-left: 8px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      a.secundario:hover {
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>La página no existe</h1>
      <p class="texto">
        La dirección que abriste no está disponible. Revisá el enlace o volvé al
        inicio.
      </p>
      <a href="/">Ir a la tienda</a>
      <a class="secundario" href="/admin">Panel</a>
    </main>
  </body>
</html>
